[package]
name = "mdpad"
version = "1.0.0"
edition = "2021"
authors = ["MDPad Contributors", "Nikko Gonzales (RE:Notepad architecture)"]
description = "MDPad: native Windows 10/11 Notepad & Markdown editor built in pure Rust + Win32/GDI following RE:Notepad architecture. Single ~700 KB executable, dark by default, zero telemetry, zero external servers."
license = "MIT"
publish = false

[[bin]]
name = "MDPad"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# Only for the Vista-style file dialog (IFileDialogCustomize = the Encoding combo).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# Already pulled in by `windows`; named here because the #[interface] macro
# (jumplist.rs) refers to it.
windows-core = "0.62"
# Markdown preview (markdown.rs). No default features: no HTML writer, no SIMD.
pulldown-cmark = { version = "0.13.6", default-features = false }

[build-dependencies]
# Compiles the generated .rc (icon + version info) with the Windows SDK's rc.exe.
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
