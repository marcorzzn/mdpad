[package]
name = "mdpad-desktop"
version = "1.0.0"
description = "MDPad — Blocco Note Markdown & Post-it Cartelle (MarkItDown) di Marco Razzano"
authors = ["Marco Razzano"]
license = "MIT"
edition = "2021"

[[bin]]
name = "MDPad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
