name: Build Native Windows Release (Rust + Win32 Installer, Portable ZIP & SHA256SUMS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-native-windows:
    name: Build Native Rust+Win32 MDPad (Setup EXE, Portable ZIP & SHA256SUMS)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22 (Web tests & build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies & verify Web suite
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }
          npm run lint
          npm test
          npm run build

      - name: Setup Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run native Rust + Win32 unit tests
        working-directory: native
        shell: pwsh
        env:
          MDPAD_UPDATE_REPO: ${{ github.repository }}
        run: cargo test

      - name: Build & Package Native MDPad.exe (Inno Setup Installer + Clean Portable ZIP + SHA256SUMS)
        shell: pwsh
        env:
          MDPAD_UPDATE_REPO: ${{ github.repository }}
          WIN_CSC_PFX_BASE64: ${{ secrets.WIN_CSC_PFX_BASE64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
        run: pwsh -File native/scripts/package.ps1

      - name: Verify generated native Windows release artifacts
        shell: pwsh
        run: |
          Get-ChildItem native/dist -File | Format-Table Name, Length
          if (-not (Get-ChildItem native/dist/MDPad-*-setup.exe -ErrorAction SilentlyContinue)) {
            throw "MDPad-*-setup.exe was not generated."
          }
          if (-not (Get-ChildItem native/dist/MDPad-*-portable.zip -ErrorAction SilentlyContinue)) {
            throw "MDPad-*-portable.zip was not generated."
          }
          if (-not (Test-Path native/dist/SHA256SUMS.txt)) {
            throw "SHA256SUMS.txt was not generated."
          }

      - name: Upload Native Windows Installer (MDPad-setup.exe)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Native-Installer-Windows
          path: native/dist/MDPad-*-setup.exe
          retention-days: 30

      - name: Upload Native Portable ZIP (MDPad-portable.zip)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Native-Portable-ZIP-Windows
          path: native/dist/MDPad-*-portable.zip
          retention-days: 30

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-SHA256SUMS
          path: native/dist/SHA256SUMS.txt
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release (on v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Native Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: MDPad-Native-Installer-Windows
          path: artifacts

      - name: Download Native Portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: MDPad-Native-Portable-ZIP-Windows
          path: artifacts

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v8
        with:
          name: MDPad-SHA256SUMS
          path: artifacts

      - name: Create GitHub Release with Native Rust+Win32 MDPad assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/MDPad-*-setup.exe
            artifacts/MDPad-*-portable.zip
            artifacts/SHA256SUMS.txt
