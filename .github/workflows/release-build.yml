name: Build MDPad Release (Windows, Android APK, Linux & macOS — by Marco Razzano)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web:
    name: Web Lint, Unit Tests & Offline Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies, test & build offline dist/
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run lint
          npm test
          npm run build

      - name: Upload compiled offline web bundle (dist/)
        uses: actions/upload-artifact@v7
        with:
          name: mdpad-web-dist
          path: dist/
          retention-days: 7

  build-windows:
    name: Windows Desktop (Tauri v2 Native EXE, Inno Setup & Portable ZIP)
    needs: [build-web]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download compiled web bundle
        uses: actions/download-artifact@v8
        with:
          name: mdpad-web-dist
          path: dist

      - name: Setup Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build & Package Native Windows MDPad (Full UI + Native FS + Inno Setup + Portable ZIP)
        shell: pwsh
        env:
          WIN_CSC_PFX_BASE64: ${{ secrets.WIN_CSC_PFX_BASE64 }}
          WIN_CSC_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
        run: pwsh -File src-tauri/scripts/package-windows.ps1

      - name: Upload Windows Installer (MDPad-setup.exe)
        id: upload-win-installer
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Windows-Installer
          path: src-tauri/dist/MDPad-*-setup.exe
          retention-days: 30

      - name: Check optional SignPath Foundation signing secrets
        id: signpath-check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Optional SignPath Foundation Open-Source Code Signing
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mdpad' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-win-installer.outputs.artifact-id }}
          output-artifact-directory: src-tauri/dist-signed
          wait-for-completion: true

      - name: Upload Signed Windows Installer (SignPath OSS)
        if: steps.signpath-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Windows-Installer-Signed
          path: src-tauri/dist-signed/*
          retention-days: 30

      - name: Upload Windows Portable ZIP (MDPad-portable.zip)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Windows-Portable-ZIP
          path: src-tauri/dist/MDPad-*-portable.zip
          retention-days: 30

      - name: Upload Windows SHA256SUMS.txt
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Windows-SHA256SUMS
          path: src-tauri/dist/SHA256SUMS.txt
          retention-days: 30

  build-android:
    name: Android Native APK (Default .md Editor + Offline MarkItDown + SAF)
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download compiled web bundle into Android assets/
        uses: actions/download-artifact@v8
        with:
          name: mdpad-web-dist
          path: android/app/src/main/assets

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Decode optional Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mdpad-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mdpad-release.jks" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 not configured; building debug APK."
          fi

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../MDPad-1.0.0-android.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../MDPad-1.0.0-android.apk
          fi

      - name: Generate Android SHA256SUMS
        run: sha256sum MDPad-1.0.0-android.apk > SHA256SUMS-android.txt

      - name: Upload Android APK & Checksum
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Android-APK
          path: |
            MDPad-1.0.0-android.apk
            SHA256SUMS-android.txt
          retention-days: 30

  build-linux:
    name: Linux Desktop (Tauri v2 Native Binary)
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download compiled web bundle
        uses: actions/download-artifact@v8
        with:
          name: mdpad-web-dist
          path: dist

      - name: Install Linux WebKitGTK / GTK3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux MDPad binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package Linux Portable tar.gz
        run: |
          mkdir -p linux-dist
          cp src-tauri/target/release/MDPad linux-dist/MDPad
          cp LICENSE linux-dist/LICENSE.txt
          tar -czf MDPad-1.0.0-linux-x64.tar.gz -C linux-dist .
          sha256sum MDPad-1.0.0-linux-x64.tar.gz > SHA256SUMS-linux.txt

      - name: Upload Linux Desktop Package
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Linux-x64
          path: |
            MDPad-1.0.0-linux-x64.tar.gz
            SHA256SUMS-linux.txt
          retention-days: 30

  build-macos:
    name: macOS Desktop (Tauri v2 Native Binary)
    needs: [build-web]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download compiled web bundle
        uses: actions/download-artifact@v8
        with:
          name: mdpad-web-dist
          path: dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS MDPad binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package macOS Portable ZIP
        run: |
          mkdir -p macos-dist
          cp src-tauri/target/release/MDPad macos-dist/MDPad
          cp LICENSE macos-dist/LICENSE.txt
          zip -j MDPad-1.0.0-macos.zip macos-dist/MDPad macos-dist/LICENSE.txt
          shasum -a 256 MDPad-1.0.0-macos.zip > SHA256SUMS-macos.txt

      - name: Upload macOS Desktop Package
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-macOS
          path: |
            MDPad-1.0.0-macos.zip
            SHA256SUMS-macos.txt
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release (on v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release with Windows, Android, Linux & macOS binaries
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/MDPad-*-setup.exe
            artifacts/MDPad-*-portable.zip
            artifacts/MDPad-*-android.apk
            artifacts/MDPad-*-linux-x64.tar.gz
            artifacts/MDPad-*-macos.zip
            artifacts/SHA256SUMS*.txt
