name: Build Release (Windows Desktop Installer, Portable EXE & ZIP)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-desktop:
    name: Build Standalone Windows App (Setup EXE, Portable EXE & ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install root dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Type-check & run unit tests
        run: |
          npm run lint
          npm test

      - name: Build production frontend
        run: npm run build

      - name: Bundle embedded MarkItDown backend for Desktop app
        run: node scripts/bundle-desktop-server.mjs

      - name: Install Desktop packager dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Pre-cache winCodeSign (skip macOS symlinks on Windows)
        shell: pwsh
        run: |
          $cacheDir = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign\winCodeSign-2.6.0"
          if (-not (Test-Path $cacheDir)) {
            New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
            $archive = "$env:TEMP\winCodeSign-2.6.0.7z"
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" -OutFile $archive
            7z x $archive "-o$cacheDir" -y "-x!darwin" | Out-Null
          }

      - name: Package Windows Installer, Portable EXE & Portable ZIP
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack:win

      - name: Verify generated Windows packages
        shell: pwsh
        run: |
          Get-ChildItem release-desktop -File | Format-Table Name, Length
          if (-not (Get-ChildItem release-desktop/MDPad-Setup-*.exe -ErrorAction SilentlyContinue)) {
            throw "MDPad-Setup-*.exe was not generated."
          }
          if (-not (Get-ChildItem release-desktop/MDPad-Portable-*.exe -ErrorAction SilentlyContinue)) {
            throw "MDPad-Portable-*.exe was not generated."
          }
          if (-not (Get-ChildItem release-desktop/MDPad-Windows-*.zip -ErrorAction SilentlyContinue)) {
            throw "MDPad-Windows-*.zip was not generated."
          }

      - name: Upload Windows One-Click Installer (MDPad-Setup.exe)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Setup-Installer-Windows
          path: release-desktop/MDPad-Setup-*.exe
          retention-days: 30

      - name: Upload Single-File Portable EXE (MDPad-Portable.exe)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Portable-Single-EXE-Windows
          path: release-desktop/MDPad-Portable-*.exe
          retention-days: 30

      - name: Upload Standalone Portable ZIP (MDPad-Windows-x64.zip)
        uses: actions/upload-artifact@v7
        with:
          name: MDPad-Portable-ZIP-Windows
          path: release-desktop/MDPad-Windows-*.zip
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release (on v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: MDPad-Setup-Installer-Windows
          path: artifacts

      - name: Download Portable Single EXE
        uses: actions/download-artifact@v8
        with:
          name: MDPad-Portable-Single-EXE-Windows
          path: artifacts

      - name: Download Portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: MDPad-Portable-ZIP-Windows
          path: artifacts

      - name: Create GitHub Release with standalone Windows apps
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/MDPad-Setup-*.exe
            artifacts/MDPad-Portable-*.exe
            artifacts/MDPad-Windows-*.zip
